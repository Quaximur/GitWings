# Put this into your profile repository (github.com/<you>/<you>) as
# .github/workflows/wings.yml — it regenerates the wings every day and
# publishes them to the `output` branch, which your README links to.
# It also rewrites the block between <!-- gitwings:start --> and
# <!-- gitwings:end --> in README.md: the wings plus real links to your stack.

name: Wings

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: YOUR_NAME/GitWings@main
        with:
          target: ${{ github.repository_owner }} # or owner/repo for a single repository
          output: dist/wings.svg
          dark_output: dist/wings-dark.svg
          readme: README.md

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this doesn't loop.
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "Refresh wings links" && git push; }

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
